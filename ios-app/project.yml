name: ArpeggiCast
options:
  bundleIdPrefix: com.arpeggicast
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  ArpeggiCast:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ArpeggiCast
    info:
      path: ArpeggiCast/Info.plist
    settings:
      base:
        PRODUCT_NAME: ArpeggiCast
        PRODUCT_BUNDLE_IDENTIFIER: com.arpeggicast.player
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ArpeggiCast/Info.plist
        ENABLE_PREVIEWS: YES
