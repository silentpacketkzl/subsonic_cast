version: '3.8'

services:
  arpeggi-connect:
    build:
      context: .
      dockerfile: Dockerfile
    image: arpeggi-connect:latest
    container_name: arpeggi-connect
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/info', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
