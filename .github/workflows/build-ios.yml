name: Build Native iOS App (IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Native iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build and Archive iOS App
        run: |
          cd ios-app
          xcodebuild -project ArpeggiCast.xcodeproj \
            -scheme ArpeggiCast \
            -destination "generic/platform=iOS" \
            -configuration Release \
            clean archive \
            -archivePath build/ArpeggiCast.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA for Sideloading (AltStore / SideStore / Sideloadly)
        run: |
          mkdir -p Payload
          cp -r ios-app/build/ArpeggiCast.xcarchive/Products/Applications/ArpeggiCast.app Payload/
          zip -r ArpeggiCast.ipa Payload
          echo "IPA packaging complete!"
          ls -lh ArpeggiCast.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArpeggiCast-IPA
          path: ArpeggiCast.ipa
          if-no-files-found: error
          retention-days: 14
